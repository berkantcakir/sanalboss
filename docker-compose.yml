version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sanalboss
      POSTGRES_USER: sanalboss
      POSTGRES_PASSWORD: sanalboss
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
